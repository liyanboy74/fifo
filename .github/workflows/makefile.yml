name: Makefile CI

on:
  push:
    branches: [ "fix/circular-fifo" ]
  pull_request:
    branches: [ "fix/circular-fifo" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build library
        run: make

      - name: Build test binary
        run: make test

      - name: Run example
        run: make run
